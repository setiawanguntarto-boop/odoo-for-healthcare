[options]
; ==============================================================================
; KLINIK ADERA ERP - ODOO 19 CE PRODUCTION CONFIGURATION
; ==============================================================================

; --- Database Configuration ---
db_host = localhost
db_port = 5432
db_user = odoo
db_password = 12345
db_name = adera_prod
db_maxconn = 64
dbfilter = ^adera_prod$

; --- Addons Path ---
addons_path = C:/odoo/addons,C:/odoo/odoo/addons,C:/odoo/my_custom_addons

; --- Multiprocessing & Performance Tuning ---
; Rule of thumb: workers = (2 * CPU cores) + 1. For 4 cores = 9 workers.
; On Windows native development, workers must be 0 (multithreading). 
; When deployed on Linux / WSL2 / Docker production, set workers = 5 to 9.
workers = 5
max_cron_threads = 2

; Memory limits per worker (in bytes)
; 2.5 GB soft limit / 3.0 GB hard limit
limit_memory_soft = 2684354560
limit_memory_hard = 3221225472

; Execution time limits
limit_time_cpu = 120
limit_time_real = 240
limit_time_real_cron = 600

; --- Networking & Security ---
http_interface = 127.0.0.1
http_port = 8069
longpolling_port = 8072
proxy_mode = True

; Prevent database manager access in production
list_db = False
admin_passwd = $pbkdf2-sha512$25000$P9y0W4pQx4.1bO5b... ; Run odoo-bin to generate hashed admin secret

; --- Logging ---
logfile = C:/odoo/logs/odoo-production.log
log_level = info
log_db = False
log_handler = :INFO,odoo.addons.adera_clinic_bridge:DEBUG

