# ==============================================================================
# KLINIK ADERA ERP - NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================

# Rate Limiting Zone for EHR REST API Endpoint (Protect against flood/DoS)
limit_req_zone $binary_remote_addr zone=adera_api_limit:10m rate=30r/s;

# Upstream Backend Handlers
upstream odoo_backend {
    server 127.0.0.1:8069;
}

upstream odoo_websocket {
    server 127.0.0.1:8072;
}

# HTTP to HTTPS Redirection
server {
    listen 80;
    server_name erp.klinikadera.co.id;
    return 301 https://$host$request_uri;
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    server_name erp.klinikadera.co.id;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/erp.klinikadera.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.klinikadera.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/odoo_access.log;
    error_log /var/log/nginx/odoo_error.log;

    # Maximum Request Payload Size (Permits batch clinical encounters & file attachments)
    client_max_body_size 64M;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    # 1. Real-time POS WebSocket & Longpolling Handler
    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 2. EHR REST API Ingestion Endpoint (Rate-Limited & Secure)
    location /api/v1/clinic/ {
        limit_req zone=adera_api_limit burst=20 nodelay;
        proxy_pass http://odoo_backend;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # 3. Static Assets Caching
    location ~* /web/static/ {
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://odoo_backend;
    }

    # 4. Standard Odoo Web Requests
    location / {
        proxy_pass http://odoo_backend;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

